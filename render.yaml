services:
  - type: cron
    name: fantasy-arena-football-sync
    runtime: node
    plan: starter
    schedule: "15 3 * * *"
    buildCommand: npm ci && npm run build
    startCommand: npm run football:sync
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_EPL_LEAGUE_ID
        sync: false
      - key: API_FOOTBALL_LALIGA_LEAGUE_ID
        sync: false
      - key: FOOTBALL_SEASON
        value: "2026"
      - key: SYNC_FROM
        value: "2026-07-01"
      - key: SYNC_TO
        value: "2027-06-30"
